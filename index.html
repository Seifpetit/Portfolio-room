<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Seif's Room</title>
<meta name="description" content="Seif's pixel-art portfolio room.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one full-screen night room drawn on canvas; panels slide over it like game dialog boxes. Deliberately single-theme. */
:root {
  --arrow: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeCAYAAAA7MK6iAAAAcElEQVR42mNgGAV0AozIHBUF9f+ENNx5cJORGhYzDZSPmQZdUG/buxEu7uXsT/VgHw1qrEGNDKgV7KNBTTCoqRXsIy+oWSjRTEwhMxrUVAnq1hnbRqtF2gU1cvAeXT1zNKhp19ijViNw5AX1KKAbAAAv2SXhDjnDzwAAAABJRU5ErkJggg==) 4 4, default;      /* Seif's pixel cursors */
  --hand: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeCAYAAAA7MK6iAAAAmElEQVR42mNgGAV0AozEKFJRUP+PTfzOg5uM5FrMNFA+HjCLWUjVsG3vRjjby9n/P7nBPhrUZAPklE9MsI+8oGYkpqDAlapxAS9nf4KFzGiqxlVQYFXTOmMbnF2d4QVnW4emIxStnok1tY8GNdZgxJWSkYMXWf1oWU1SUB9dPRMRjCQaiqx3NKgJNvaIKbeJAaNl9SigOwAAakwxK+pP0akAAAAASUVORK5CYII=) 10 4, pointer;
  --night: #1b1626;      /* page and outside */
  --wall: #3a2f4f;
  --floor: #8a5a3c;
  --ink: #f4ead8;        /* text on dark */
  --amber: #ffb347;      /* monitor glow, accent */
  --panel: #241d33;
  --muted: #b9aecb;
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
html, body { cursor: var(--arrow); }
a, button, [role="button"], summary, label { cursor: var(--hand); }
body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; }
.app { height: 100%; position: relative; display: flex; flex-direction: column; padding-block: 8px; padding-inline: 16px; box-sizing: border-box; }
header { position: absolute; top: 10px; left: 16px; right: 16px; z-index: 1; pointer-events: none; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 1.35rem; margin: 0; letter-spacing: .02em; }
h1 span { color: var(--amber); }
/* Title screen: shown on first load over the blurred room, gone on the first click, tap or key */
.title { position: fixed; inset: 0; z-index: 20; display: grid; place-content: center; justify-items: center; gap: clamp(18px, 4vh, 40px); padding: 16px; text-align: center; background: rgba(12, 9, 18, .62); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); cursor: var(--hand); transition: opacity .35s steps(4); }
.title::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 4px); }
.title.out { opacity: 0; pointer-events: none; }
.title:not(.ready) { cursor: var(--arrow); }
.title-name { visibility: hidden; } .fonts .title-name { visibility: visible; } /* no flash of a fallback font */
.title-name span { color: var(--amber); }
.title-hint, .title-load { grid-area: 2 / 1; }
.title:not(.ready) .title-hint, .title.ready .title-load { visibility: hidden; }
.title-load { position: relative; align-self: center; width: min(240px, 60vw); height: 14px; background: #241d33; box-shadow: 0 0 0 3px #120e1a, inset 0 0 0 2px #3b2d57; }
.title-load i { position: absolute; left: 2px; top: 2px; bottom: 2px; width: 0; max-width: calc(100% - 4px); background: repeating-linear-gradient(90deg, var(--amber) 0 8px, #e8902a 8px 10px); transition: width .2s steps(3); }
.title-name { position: relative; margin: 0; font: 600 clamp(3.4rem, 13vw, 8.5rem)/.95 var(--display); color: #e6ecea; letter-spacing: .02em; text-shadow: 0 6px 0 #120e1a, 6px 0 0 #120e1a, -6px 0 0 #120e1a, 0 -6px 0 #120e1a, 6px 6px 0 #120e1a, -6px 6px 0 #120e1a, 6px -6px 0 #120e1a, -6px -6px 0 #120e1a, 0 12px 0 #120e1a, 6px 12px 0 #120e1a, -6px 12px 0 #120e1a; animation: rise .5s steps(5) backwards, titlefloat 3.6s ease-in-out .5s infinite; }
@keyframes titlefloat { 50% { transform: translateY(-5px); } }
.title-hint { position: relative; margin: 0; font: 400 clamp(1.1rem, 3.4vw, 1.9rem) var(--display); color: #d9d2e6; letter-spacing: .04em; text-shadow: 3px 3px 0 #120e1a; animation: hintpulse 1.8s steps(3) infinite .6s; }
@keyframes hintpulse { 50% { opacity: .35; } }
.title-hint .touch { display: none; }
@media (hover: none) { .title-hint .mouse { display: none; } .title-hint .touch { display: inline; } }
@media (max-width: 520px) { .title-name { text-shadow: 0 4px 0 #120e1a, 4px 0 0 #120e1a, -4px 0 0 #120e1a, 0 -4px 0 #120e1a, 4px 4px 0 #120e1a, -4px 4px 0 #120e1a, 4px -4px 0 #120e1a, -4px -4px 0 #120e1a, 0 8px 0 #120e1a; } }
@media (prefers-reduced-motion: reduce) { .title-name, .title-hint { animation: none; } }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; }
canvas { touch-action: none; cursor: var(--hand); image-rendering: pixelated; max-width: 100%; border-radius: 4px; background: #2a2133; box-shadow: 0 0 0 4px #120e1a, 0 18px 40px rgba(0,0,0,.45); }
nav { position: absolute; bottom: 12px; left: 16px; right: 16px; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
nav button { font: 600 .85rem var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: rgba(27,22,38,.8); border: 2px solid var(--wall); padding: 6px 12px; border-radius: 2px; cursor: var(--hand); }
nav button:hover, nav button:focus-visible { border-color: var(--amber); color: var(--amber); outline: none; }
nav small { display: none; width: 100%; text-align: center; color: var(--muted); font-size: .75rem; }

.overlay { z-index: 5; position: fixed; inset: 0; background: rgba(12, 9, 18, .62); display: grid; place-items: end center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.dialog { width: min(640px, 100%); max-height: 78%; overflow: auto; background: var(--panel); border: 4px solid var(--ink); box-shadow: 0 0 0 4px var(--night), 8px 8px 0 4px rgba(0,0,0,.35); padding: 18px 20px 20px; box-sizing: border-box; animation: rise .22s steps(4); }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .dialog { animation: none; } }
.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; }
.dialog h2 { font: 600 1.3rem var(--display); margin: 0; color: var(--amber); }
.close { font: 600 .8rem var(--display); text-transform: uppercase; letter-spacing: .06em; background: var(--ink); color: var(--night); border: 0; padding: 6px 10px; cursor: var(--hand); }
.close:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.sample { display: inline-block; font: .72rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--night); background: var(--muted); padding: 2px 6px; margin-bottom: 12px; }
.dialog p { line-height: 1.55; margin: 0 0 12px; max-width: 62ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.card { border: 2px solid var(--wall); padding: 12px; min-width: 0; }
.card h3 { font: 600 1rem var(--display); margin: 0 0 4px; }
.card p { font-size: .88rem; color: var(--muted); margin: 0; }
.links { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.links li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 2px dotted var(--wall); padding-block: 6px; flex-wrap: wrap; }
.links b { font-family: var(--display); font-weight: 600; }
a { color: var(--amber); }
.cv-rows { display: grid; gap: 8px; margin-bottom: 12px; }
.cv-rows div { display: grid; grid-template-columns: 7.5em 1fr; gap: 10px; }
.cv-rows dt, .cv-rows span:first-child { font-family: var(--display); color: var(--muted); }

/* RPG dialogue banner: slides up when the character reaches an object */
.banner { z-index: 4; position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.banner-inner { position: relative; width: min(760px, 100%); pointer-events: auto; cursor: var(--hand); animation: slideup .28s steps(5); }
@keyframes slideup { from { transform: translateY(60%); opacity: 0; } }
.banner-box { margin-left: clamp(80px, 17vw, 140px); min-height: 104px; background: linear-gradient(#2b2140, #1c1530); border: 3px solid #e8c98a; outline: 3px solid #120e1a; box-shadow: 0 0 0 6px #120e1a, inset 0 0 0 3px #3b2d57, 6px 8px 0 6px rgba(0,0,0,.4); padding: 26px 22px 20px; box-sizing: border-box; position: relative; }
.banner-name { position: absolute; top: -18px; left: 16px; font: 600 1rem var(--display); letter-spacing: .06em; color: #ffe9b8; background: #4a2f3a; border: 3px solid #e8c98a; outline: 3px solid #120e1a; padding: 2px 16px; }
.banner-text { font: 400 1.18rem/1.5 var(--display); color: var(--ink); margin: 0; min-height: 3em; white-space: pre-line; }
.banner-next { position: absolute; right: 14px; bottom: 8px; font-size: .9rem; color: var(--amber); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.banner-portrait { position: absolute; left: 0; bottom: 0; width: clamp(96px, 19vw, 168px); image-rendering: pixelated; filter: drop-shadow(4px 0 0 #120e1a) drop-shadow(-4px 0 0 #120e1a) drop-shadow(0 -4px 0 #120e1a); pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .banner-inner, .banner-next { animation: none; } }

/* Projects: listing-style pixel cards */
.dialog.wide { width: min(1100px, 100%); max-height: 100%; align-self: end; overflow: visible; background: none; border: 0; box-shadow: none; padding: 8px 4px 24px; animation: none; }
.overlay.floating { place-items: center; grid-template-columns: minmax(0, 1fr); background: rgba(8, 6, 14, .72); }
.dialog.wide { min-width: 0; justify-self: center; }
.dialog.wide .dialog-head { margin-bottom: 4px; }
.dialog.wide h2 { font-size: 1.6rem; text-shadow: 3px 3px 0 #120e1a; }
.dialog.wide .sample-note { text-shadow: 2px 2px 0 #120e1a; }
.dialog.wide .sample { text-shadow: none; }
body.floating header, body.floating nav { visibility: hidden; }
body.floating .banner { z-index: 6; }
body.floating .banner-inner { animation: none; cursor: var(--arrow); }
body.floating .banner-next { display: none; }
.overlay.floating { padding-bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 520px) { .overlay.floating { padding-bottom: calc(176px + env(safe-area-inset-bottom, 0px)); } .banner-text { font-size: .95rem; } .banner-box { padding: 22px 14px 14px; min-height: 92px; } }

.sample-note { margin: 0 0 14px !important; color: var(--muted); }
.pcards { display: flex; gap: 18px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; padding: 6px 6px 12px; }
.pcards > .pcard { flex: 0 0 240px; scroll-snap-align: start; }
/* timid pixel scrollbar (custom, so it looks the same everywhere): shows while scrolling, then fades out */
.pcards { scrollbar-width: none; }
.pcards::-webkit-scrollbar { display: none; }
.pscroll { position: relative; height: 8px; margin: 2px 8px 0; opacity: 0; transition: opacity .25s steps(3); background: repeating-linear-gradient(90deg, rgba(185,174,203,.14) 0 4px, transparent 4px 8px); touch-action: none; }
.pscroll.on { opacity: .75; transition: opacity .08s steps(2); }
.pscroll:hover { opacity: .9; }
.pscroll i { position: absolute; top: 0; bottom: 0; left: 0; background: #8f84a3; box-shadow: inset 2px 2px 0 #cfc5dd, inset -2px -2px 0 #4a3f5e, 0 0 0 2px #120e1a; cursor: var(--hand); }
.pcard { all: unset; box-sizing: border-box; display: flex; flex-direction: column; background: #1c1530; border: 3px solid #e8c98a; box-shadow: 0 0 0 3px #120e1a, 5px 6px 0 3px rgba(0,0,0,.45); cursor: var(--hand); text-align: left; color: var(--ink); animation: pop .5s backwards; }
/* sticker pop: each card slaps in with an overshoot and a wobble, in chunky steps */
@keyframes pop {
  0% { transform: scale(.25) rotate(-12deg); opacity: 0; animation-timing-function: steps(3); }
  40% { transform: scale(1.14) rotate(5deg); opacity: 1; border-color: #fff; animation-timing-function: steps(2); }
  60% { transform: scale(.93) rotate(-3deg); animation-timing-function: steps(2); }
  78% { transform: scale(1.04) rotate(1deg); animation-timing-function: steps(2); }
  100% { transform: none; }
}
.pcard:nth-child(1) { animation-delay: .15s; } .pcard:nth-child(2) { animation-delay: .27s; } .pcard:nth-child(3) { animation-delay: .39s; } .pcard:nth-child(4) { animation-delay: .51s; } .pcard:nth-child(5) { animation-delay: .63s; } .pcard:nth-child(6) { animation-delay: .75s; }
.pcard:hover, .pcard:focus-visible { transform: translate(-2px, -3px); border-color: var(--amber); box-shadow: 0 0 0 3px #120e1a, 8px 10px 0 3px rgba(0,0,0,.45); }
.pcard:focus-visible { outline: 3px solid var(--amber); outline-offset: 4px; }
.pcard:active { transform: translate(1px, 1px); }
.pthumb { position: relative; display: block; aspect-ratio: 2 / 1; border-bottom: 3px solid #e8c98a; background: #0c0912; overflow: hidden; }
.pthumb canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.pbadge { position: absolute; top: 8px; left: 8px; font: 600 .7rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: #1b1626; background: var(--amber); border: 2px solid #120e1a; padding: 1px 7px; }
.pbody { display: flex; flex-direction: column; gap: 5px; padding: 10px 12px 6px; flex: 1; }
.ptitle { font: 600 1.1rem var(--display); color: #ffe9b8; }
.pdesc { font-size: .84rem; line-height: 1.35; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ptags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; padding-top: 4px; }
.ptags span { font: .7rem var(--display); letter-spacing: .04em; color: var(--ink); background: #3b2d57; border: 2px solid #120e1a; padding: 1px 6px; }
.pfoot { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px 10px; border-top: 2px dotted #3b2d57; font: 600 .85rem var(--display); }
.pfoot > span:first-child { color: var(--amber); }
.pcta { color: #7ff3ff; }
@media (max-width: 640px) { .pcards { gap: 14px; scroll-snap-type: x mandatory; } .pcards > .pcard { flex: 0 0 72%; scroll-snap-align: center; } .dialog.wide { padding: 8px 0 8px; align-self: end; } }
@media (prefers-reduced-motion: reduce) { .pcard { animation: none; } .pcard:hover { transform: none; } }

/* Socials: big frameless pixel logos, each tilted a little */
.socials { display: grid; grid-template-columns: auto auto; justify-content: center; gap: 22px clamp(36px, 8vw, 72px); padding: 18px 8px 10px; }
.socials .sicon.mail { grid-column: 1 / -1; justify-self: center; }
.sicon { display: flex; flex-direction: column; align-items: center; gap: 16px; text-decoration: none; color: var(--ink); animation: pop .5s backwards; outline: none; }
.sicon:nth-child(1) { animation-delay: .15s; } .sicon:nth-child(2) { animation-delay: .3s; } .sicon:nth-child(3) { animation-delay: .45s; }
.slogo { display: grid; place-items: center; width: clamp(84px, 18vw, 112px); aspect-ratio: 1; transform: rotate(var(--tilt, 0deg)); }
.slogo canvas { width: 100%; max-width: none; background: none; box-shadow: none; border-radius: 0; cursor: var(--hand); image-rendering: pixelated; transition: transform .32s cubic-bezier(.3, 1.9, .5, 1), filter .2s; filter: drop-shadow(3px 3px 0 #120e1a); }
.slogo.li canvas { --glow: #2f8fff; } .slogo.gh canvas { --glow: #b9f5ff; } .slogo.gm canvas { --glow: #ff6b5e; }
.sicon:hover .slogo canvas, .sicon:focus-visible .slogo canvas { transform: scale(1.16); filter: drop-shadow(3px 3px 0 #120e1a) drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 14px var(--glow)); }
.sicon:focus-visible .slabel { color: var(--amber); text-decoration: underline; }
.slabel { font: 600 1.05rem var(--display); letter-spacing: .06em; text-shadow: 2px 2px 0 #120e1a; }
.dialog.wide .dialog-head { gap: 56px; }
.dialog.wide[data-panel=socials] { width: auto; }
.slabel { font: 600 1.05rem var(--display); letter-spacing: .06em; text-shadow: 2px 2px 0 #120e1a; }


/* Projects sit on a pixel computer screen */
.monitor { position: relative; padding: 14px; background: #3a3350; box-shadow: inset 4px 4px 0 #5a5175, inset -4px -4px 0 #231d33, 0 0 0 4px #120e1a, 8px 10px 0 4px rgba(0,0,0,.4); animation: poweron .45s steps(5) backwards; }
.monitor::after { content: ""; position: absolute; right: 18px; bottom: 4px; width: 6px; height: 6px; background: #5cf2c6; box-shadow: 0 0 0 2px #120e1a, 0 0 8px #5cf2c6; animation: blink 2.4s steps(2) infinite; }
.screen { position: relative; background: radial-gradient(ellipse at 50% 40%, #12384a 0, #0b2030 55%, #08141f 100%); box-shadow: inset 0 0 0 3px #120e1a, inset 0 0 28px rgba(92,242,198,.18); padding: 26px 12px 22px; overflow: hidden; }
.screen::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px); }
.screen .sample-note { margin: 0 6px 18px !important; color: #9ff5dc; font-family: var(--display); }
.screen .sample-note::before { content: "C:\\SEIF\\PROJECTS> "; color: #5cf2c6; }
.screen .pscroll i { background: #3fae90; box-shadow: inset 2px 2px 0 #9ff5dc, inset -2px -2px 0 #1d5a4b, 0 0 0 2px #120e1a; }
.stand { width: 64px; height: 18px; margin: 0 auto; background: #2c2640; box-shadow: inset 4px 0 0 #4a4263, 0 0 0 4px #120e1a; position: relative; z-index: -1; animation: poweron .45s steps(5) backwards; }
.stand::after { content: ""; position: absolute; left: -48px; right: -48px; top: 18px; height: 12px; background: #3a3350; box-shadow: inset 0 4px 0 #5a5175, 0 0 0 4px #120e1a; }
.stand + * { margin-top: 0; }
.monitor + .stand { margin-bottom: 34px; }
.monitor .pcard:nth-child(1) { animation-delay: 0.52s; } .monitor .pcard:nth-child(2) { animation-delay: 0.64s; } .monitor .pcard:nth-child(3) { animation-delay: 0.76s; } .monitor .pcard:nth-child(4) { animation-delay: 0.88s; } .monitor .pcard:nth-child(5) { animation-delay: 1.00s; } .monitor .pcard:nth-child(6) { animation-delay: 1.12s; } 
@keyframes poweron { 0% { transform: scale(1, .02); filter: brightness(3); opacity: 0; } 40% { transform: scale(1, .02); filter: brightness(3); opacity: 1; } 70% { transform: scale(1, 1.03); } }


/* CV: a vertical paper on the bureau, the desk and trophies barely there behind it */
.cvscene { position: relative; width: min(900px, 100%); height: clamp(380px, calc(100dvh - 232px), 860px); margin: 0 auto; display: grid; place-items: center; }
.cvscene .desk { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; image-rendering: pixelated; opacity: .26; background: none; box-shadow: none; border-radius: 0; animation: rise .3s steps(4) backwards; -webkit-mask-image: radial-gradient(ellipse at 50% 55%, #000 45%, transparent 80%); mask-image: radial-gradient(ellipse at 50% 55%, #000 45%, transparent 80%); }
.cvdoc { position: relative; height: 100%; width: auto; aspect-ratio: 1 / 1.41; max-width: 92vw; box-sizing: border-box; padding: clamp(18px, 3.4vh, 34px) clamp(18px, 3vh, 32px) clamp(14px, 2.6vh, 26px); font-size: clamp(14px, 2.1vh, 19px); container-type: inline-size; background: #f4ead8; color: #2a1d14; transform: rotate(-1.5deg); box-shadow: inset 0 0 0 2px #d8c7a6, 0 0 0 3px #120e1a, 8px 10px 0 3px rgba(0,0,0,.45), 0 0 70px rgba(255,233,184,.28); animation: pop .55s .2s backwards; display: flex; flex-direction: column; gap: .8em; overflow: hidden; }
.cvdoc::after { content: ""; position: absolute; right: 0; bottom: 0; border: 9px solid; border-color: #d8c7a6 #1c1530 #1c1530 #d8c7a6; }
.cvtop { display: flex; gap: 1em; align-items: center; }
.cvphoto { flex: 0 0 26cqw; height: 31cqw; background: #c9b896; box-shadow: inset 0 0 0 2px #2a1d14; position: relative; overflow: hidden; }
.cvphoto::before { content: ""; position: absolute; left: 50%; top: 18%; width: 40%; height: 34%; margin-left: -20%; background: #9c8a68; }
.cvphoto::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 72%; height: 30%; margin-left: -36%; background: #9c8a68; }
.cvname { font: 600 2em var(--display); margin: 0; }
.cvrole { font: .9em var(--display); letter-spacing: .06em; text-transform: uppercase; color: #8a5a3c; margin: 2px 0 0; }
.cvsec h4 { font: 600 .9em var(--display); letter-spacing: .1em; text-transform: uppercase; margin: 0 0 5px; padding-bottom: 3px; border-bottom: 2px solid #2a1d14; }
.cvsec i { display: block; height: .4em; margin: 0 0 .5em; background: #cdbd9c; }
.cvsec i:nth-child(3n) { width: 72%; } .cvsec i:nth-child(3n+1) { width: 90%; }
.cvdoc .sample { align-self: flex-start; margin: auto 0 0; }
.cvdoc { cursor: var(--hand); outline: none; transition: transform .35s cubic-bezier(.3, 1.4, .5, 1), box-shadow .25s; z-index: 1; }

    trophy(30, 46, "#9aa0ab", "#d4d8de", "#636874");
    trophy(152, 42, "#e0a83a", "#ffe08a", "#9a6418");
  }
  // a long CV shrinks its own text until it fits the paper
  function fitCv() {
    const doc = document.querySelector("#dlg-body .cvdoc"); if (!doc) return;
    doc.style.fontSize = ""; let fs = parseFloat(getComputedStyle(doc).fontSize);
    while (doc.scrollHeight > doc.clientHeight + 1 && fs > 8) { fs -= 0.5; doc.style.fontSize = fs + "px"; }
  }
  addEventListener("resize", () => { if (!overlay.hidden) fitCv(); });
  function openPanel(id) {
    opener = document.activeElement;
    document.getElementById("dlg-title").textContent = titles[id];
    document.getElementById("dlg-body").replaceChildren(BUILD[id]());
    const floating = FLOAT.has(id);
    document.querySelector(".dialog").classList.toggle("wide", floating);
    document.querySelector(".dialog").dataset.panel = id;
    overlay.classList.toggle("floating", floating); document.body.classList.toggle("floating", floating);
    document.querySelectorAll("#dlg-body canvas[data-logo], #dlg-body canvas[data-img]").forEach(drawLogo);
    document.querySelectorAll("#dlg-body .slogo").forEach((el) => el.style.setProperty("--tilt", (Math.random() * 14 - 7).toFixed(1) + "deg")); // a little random tilt each time
    if (floating) {
      banner.hidden = false; if (!talkState) bText.textContent = LINES[id].join("\n");
      // hovering or focusing a card swaps the capybara's line (placeholder per project for now)
      document.querySelectorAll("#dlg-body [data-say]").forEach((c) => {
        const typing = () => talkState && !talkState.held; // still typing, or holding the finished intro for a moment
        const say = () => { hoverCard = c; if (!typing()) bText.textContent = c.dataset.say; };
        const back = () => { if (hoverCard === c) hoverCard = null; if (!typing()) bText.textContent = LINES[id].join("\n"); };
        c.addEventListener("pointerenter", say); c.addEventListener("focus", say);
        c.addEventListener("pointerleave", back); c.addEventListener("blur", back);
      });
    }
    document.querySelectorAll("#dlg-body canvas.desk").forEach(drawDesk);
    const doc = document.querySelector("#dlg-body .cvdoc");
    if (doc) {
      doc.addEventListener("click", () => cvZoom(!doc.classList.contains("zoom")));
      doc.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); cvZoom(!doc.classList.contains("zoom")); } });
    }
    document.querySelectorAll("#dlg-body canvas[data-seed]").forEach((cv) => drawThumb(cv, +cv.dataset.seed));
    const row = document.querySelector("#dlg-body .pcards"), bar = document.querySelector("#dlg-body .pscroll");
    if (row && bar) {
      const thumb = bar.firstElementChild; let hide;
      const place = () => {
        const max = row.scrollWidth - row.clientWidth, w = Math.max(24, bar.clientWidth * row.clientWidth / row.scrollWidth);
        thumb.style.width = w + "px"; thumb.style.transform = `translateX(${Math.round(max ? (bar.clientWidth - w) * row.scrollLeft / max : 0)}px)`;
        bar.hidden = max <= 0;
      };
      const flash = () => { bar.classList.add("on"); clearTimeout(hide); hide = setTimeout(() => bar.classList.remove("on"), 600); };
      row.addEventListener("scroll", () => { place(); flash(); }, { passive: true });
      // a mouse wheel scrolls the row sideways
      row.addEventListener("wheel", (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { row.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
      // drag the thumb, or tap the track to jump
      bar.addEventListener("pointerdown", (e) => {
        e.stopPropagation(); bar.setPointerCapture(e.pointerId);
        const r = bar.getBoundingClientRect(), w = thumb.offsetWidth;
        const go = (ev) => { row.scrollLeft = (ev.clientX - r.left - w / 2) / (r.width - w) * (row.scrollWidth - row.clientWidth); };
        go(e); bar.onpointermove = go; bar.onpointerup = () => { bar.onpointermove = null; };
      });
      requestAnimationFrame(place);
    }
    overlay.hidden = false; document.getElementById("close").focus(); fitCv();
    if (document.fonts) document.fonts.ready.then(fitCv);
  }
  // focusing the CV brings the paper front and center, over the banner, as big as the screen allows
  function cvZoom(on) {
    const doc = document.querySelector("#dlg-body .cvdoc"); if (!doc) return;
    doc.classList.toggle("zoom", on); document.body.classList.toggle("cvzoom", on);
    if (!on) { doc.style.transform = ""; return; }
    const r = doc.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const k = Math.min(innerHeight * .94 / doc.offsetHeight, innerWidth * .94 / doc.offsetWidth);
    doc.style.transform = `translate(${innerWidth / 2 - cx}px, ${innerHeight / 2 - cy}px) scale(${k.toFixed(3)})`;
  }
  addEventListener("resize", () => { if (document.body.classList.contains("cvzoom")) { cvZoom(false); cvZoom(true); } });
  function closePanel() { cvZoom(false); hoverCard = null; if (talkState) { clearInterval(talkState.timer); clearTimeout(talkState.hold); talkState = null; } overlay.hidden = true; if (document.body.classList.contains("floating")) banner.hidden = true; document.body.classList.remove("floating"); if (opener && opener.focus) opener.focus(); }
  document.getElementById("close").addEventListener("click", closePanel);
  overlay.addEventListener("pointerdown", (e) => { if (document.body.classList.contains("cvzoom") && !e.target.closest(".cvdoc")) { cvZoom(false); return; } if (e.target === overlay || (overlay.classList.contains("floating") && e.target.matches(".dialog, #dlg-body"))) closePanel(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.body.classList.contains("cvzoom")) { e.stopImmediatePropagation(); cvZoom(false); } }, true);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !overlay.hidden) closePanel(); });
  document.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => { endTalk(false); openPanel(b.dataset.open); }));

  // Debug: add #debug to the URL to see the walkable grid and object outlines
  if (location.hash === "#debug") {
    window.__debug = () => {
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) { const c = center(i, j); ctx.fillStyle = walkable(i, j) ? "rgba(0,255,120,.6)" : "rgba(255,0,0,.6)"; ctx.fillRect(c[0] - 2, c[1] - 2, 4, 4); }
      ctx.strokeStyle = "#ff0"; ctx.lineWidth = 1; OBJECTS.forEach((o) => { path(o.poly); ctx.stroke(); ctx.fillStyle = "#ff0"; ctx.fillRect(o.stand[0] - 3, o.stand[1] - 3, 6, 6); });
    };
    const orig = drawLabels; drawLabels = (t) => { orig(t); window.__debug(); };
  }

  resize();
  Promise.all(loads).then(() => { requestAnimationFrame(frame); setTimeout(() => title && title.classList.add("ready"), 150); });
})();
</script>
